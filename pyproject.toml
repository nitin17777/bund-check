[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bund-check"
version = "0.1.0"
description = "Production-minded AI Content Checker + Writing Improver platform"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PyMuPDF>=2.1.0",
    "python-docx>=1.2.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
