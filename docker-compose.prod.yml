services:
  # ---------------------------------------------------------------------------
  # PostgreSQL Database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bundcheck-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bundcheck}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Database password required}
      POSTGRES_DB: ${POSTGRES_DB:-bundcheck_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bundcheck} -d ${POSTGRES_DB:-bundcheck_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bundcheck-internal

  # ---------------------------------------------------------------------------
  # Backend API Service (FastAPI + PyTorch/Transformers CPU)
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: bundcheck-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      PORT: "8000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-bundcheck}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-bundcheck_db}
      DEFAULT_IMPROVER_PROVIDER: ${DEFAULT_IMPROVER_PROVIDER:-groq}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-llama-3.3-70b-versatile}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      CORS_ALLOWED_ORIGINS: '["https://${DOMAIN_NAME:-localhost}"]'
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - backend_data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 25s
    networks:
      - bundcheck-internal

  # ---------------------------------------------------------------------------
  # Frontend Application (Next.js SSR)
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-localhost}/api/v1
    container_name: bundcheck-frontend
    restart: always
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      NEXT_PUBLIC_API_URL: https://${DOMAIN_NAME:-localhost}/api/v1
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - bundcheck-internal

  # ---------------------------------------------------------------------------
  # Reverse Proxy & SSL Termination (Caddy)
  # ---------------------------------------------------------------------------
  reverse-proxy:
    image: caddy:2.8-alpine
    container_name: bundcheck-proxy
    restart: always
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - bundcheck-internal

volumes:
  postgres_data:
  backend_data:
  caddy_data:
  caddy_config:

networks:
  bundcheck-internal:
    driver: bridge
